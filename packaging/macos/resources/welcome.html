<h2>MLiveMIX</h2>
<p>Ouça a mix da sua DAW no celular, no navegador ou em qualquer aparelho da sua rede, em tempo real,
sem exportar arquivos.</p>
<p>Este instalador coloca o plugin em:</p>
<ul>
  <li><b>Audio Unit (AU):</b> /Library/Audio/Plug-Ins/Components</li>
  <li><b>VST3:</b> /Library/Audio/Plug-Ins/VST3</li>
</ul>
<p>Feche sua DAW antes de continuar.</p>
</body>
</html>
