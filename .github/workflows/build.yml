name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (AU + VST3, Universal)
            os: macos-15
          - name: Windows (VST3)
            os: windows-latest
          - name: Linux (VST3)
            os: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxext-dev libfontconfig1-dev libfreetype-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run offline tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./build/MLiveMixTests_artefacts/Release/MLiveMixTests.exe
          else
            ./build/MLiveMixTests_artefacts/Release/MLiveMixTests
          fi

      - name: Load the VST3 like a DAW (Linux)
        if: runner.os == 'Linux'
        run: ./build/MLiveMixPluginLoadTest_artefacts/Release/MLiveMixPluginLoadTest build/MLiveMIX_artefacts/Release/VST3/MLiveMIX.vst3

      # Real browser test: Chromium plays the stream served by the test runner
      - name: Browser end-to-end test (Linux)
        if: runner.os == 'Linux'
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          ./build/MLiveMixTests_artefacts/Release/MLiveMixTests --serve 25 18900 &
          sleep 2
          node tests/browser-e2e.js 18900
          node tests/browser-e2e.js 18900 mobile
          wait

      - name: Resolve version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^project(MLiveMIX VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          # main and v* tags produce release files named after the version; other branches get a dev label
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then LABEL="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" == push ]]; then LABEL="v$VERSION"
          else LABEL="dev-${GITHUB_SHA::7}"; fi
          echo "VERSION_LABEL=$LABEL" >> "$GITHUB_ENV"
          echo "PROJECT_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "label=$LABEL version=$VERSION"

      # Fails the build if the plugin would require a newer macOS than intended
      # (x86_64: 10.13; arm64: 11.0, the first macOS for Apple Silicon)
      - name: Check minimum macOS version
        if: runner.os == 'macOS'
        run: |
          for bin in build/MLiveMIX_artefacts/Release/VST3/MLiveMIX.vst3/Contents/MacOS/MLiveMIX \
                     build/MLiveMIX_artefacts/Release/AU/MLiveMIX.component/Contents/MacOS/MLiveMIX; do
            for arch in x86_64 arm64; do
              minos=$(vtool -arch $arch -show-build "$bin" | awk '/minos/ {print $2}')
              echo "$bin [$arch] minos=$minos"
              limit=10.13; [ "$arch" = arm64 ] && limit=11.0
              if [ "$(printf '%s\n%s\n' "$minos" "$limit" | sort -V | tail -1)" != "$limit" ]; then
                echo "::error::$arch requires macOS $minos (expected <= $limit)"; exit 1
              fi
            done
          done

      # Ad-hoc signature so Apple Silicon hosts load the bundles (no Apple account needed)
      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep --sign - build/MLiveMIX_artefacts/Release/AU/MLiveMIX.component
          codesign --force --deep --sign - build/MLiveMIX_artefacts/Release/VST3/MLiveMIX.vst3

      - name: Build installer (.pkg)
        if: runner.os == 'macOS'
        run: |
          chmod +x packaging/macos/build_pkg.sh packaging/macos/scripts-au/postinstall
          packaging/macos/build_pkg.sh build/MLiveMIX_artefacts/Release "$PROJECT_VERSION" \
            "dist/MLiveMIX-$VERSION_LABEL-macOS.pkg"

      # Install the .pkg exactly like a user would, then validate the installed plugin
      - name: Test installer + validate AU (auval)
        if: runner.os == 'macOS'
        run: |
          sudo installer -pkg "dist/MLiveMIX-$VERSION_LABEL-macOS.pkg" -target /
          test -d /Library/Audio/Plug-Ins/Components/MLiveMIX.component
          test -d /Library/Audio/Plug-Ins/VST3/MLiveMIX.vst3
          pkgutil --pkgs | grep com.mlivemix.mlivemix
          codesign --verify --deep --strict /Library/Audio/Plug-Ins/Components/MLiveMIX.component
          killall -9 AudioComponentRegistrar || true
          auval -v aufx Mlv1 Mlvm

      # Load the INSTALLED plugins the way a DAW does (VST3 + AU), process audio, open the window
      - name: Load installed plugins like a DAW (macOS Apple Silicon)
        if: runner.os == 'macOS'
        run: |
          uname -m; sw_vers -productVersion
          ./build/MLiveMixPluginLoadTest_artefacts/Release/MLiveMixPluginLoadTest /Library/Audio/Plug-Ins/VST3/MLiveMIX.vst3
          ./build/MLiveMixPluginLoadTest_artefacts/Release/MLiveMixPluginLoadTest AU

      # Zip on the runner itself so bundle structure and permissions survive
      # (upload-artifact does not preserve file permissions).
      - name: Package
        shell: bash
        run: |
          NAME="MLiveMIX-$VERSION_LABEL-$RUNNER_OS"
          mkdir -p "dist/$NAME"
          for f in AU/MLiveMIX.component VST3/MLiveMIX.vst3 VST/MLiveMIX.vst VST/MLiveMIX.dll VST/libMLiveMIX.so; do
            src="build/MLiveMIX_artefacts/Release/$f"
            if [ -e "$src" ]; then cp -R "$src" "dist/$NAME/"; fi
          done
          cd dist
          case "$RUNNER_OS" in
            macOS)   ditto -c -k --keepParent "$NAME" "$NAME.zip" ;;
            Windows) 7z a -tzip "$NAME.zip" "$NAME" > /dev/null ;;
            *)       zip -qry "$NAME.zip" "$NAME" ;;
          esac
          rm -rf "$NAME"
          ls -la

      - name: Upload plugins
        uses: actions/upload-artifact@v4
        with:
          name: MLiveMIX-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.pkg
          if-no-files-found: error

  # Install the released .pkg on an INTEL Mac and load both plugins like a DAW does
  mac-intel:
    name: macOS Intel (install .pkg + load like a DAW)
    needs: build
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MLiveMIX-macOS
          path: dist

      - name: Install the .pkg
        run: |
          uname -m; sw_vers -productVersion
          ls -la dist
          sudo installer -pkg dist/*.pkg -target /
          killall -9 AudioComponentRegistrar || true

      - name: Build the loader (native x86_64)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64
          cmake --build build --config Release --target MLiveMixPluginLoadTest --parallel 4

      - name: Load VST3 and AU like a DAW
        run: |
          ./build/MLiveMixPluginLoadTest_artefacts/Release/MLiveMixPluginLoadTest /Library/Audio/Plug-Ins/VST3/MLiveMIX.vst3
          ./build/MLiveMixPluginLoadTest_artefacts/Release/MLiveMixPluginLoadTest AU
          auval -v aufx Mlv1 Mlvm | tail -5

  # Every push to main creates/updates the release for the version in CMakeLists.txt
  # (bump VERSION there to start a new release). Pushing a v* tag also works.
  release:
    name: Publish GitHub Release
    needs: [ build, mac-intel ]
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"
          else TAG="v$(sed -n 's/^project(MLiveMIX VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: MLiveMIX ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: |
            dist/*.pkg
            dist/*.zip
          generate_release_notes: true
          body: |
            ## Downloads

            | Sistema | Arquivo | O que é |
            |---|---|---|
            | **macOS** (Apple Silicon + Intel) | `MLiveMIX-${{ env.TAG }}-macOS.pkg` | **Instalador** (AU + VST3) — recomendado |
            | macOS | `MLiveMIX-${{ env.TAG }}-macOS.zip` | Plugins soltos, para instalar manualmente |
            | Windows | `MLiveMIX-${{ env.TAG }}-Windows.zip` | VST3 |
            | Linux | `MLiveMIX-${{ env.TAG }}-Linux.zip` | VST3 |

            ## Como usar

            1. Coloque o **MLiveMIX** no último slot do **Master** da sua DAW. O som da DAW não é alterado.
            2. Abra a janela do plugin. Com o celular no **mesmo Wi-Fi**, aponte a câmera para o **QR Code**.
            3. Toque em **OUVIR**. No próprio Mac, use o botão **ABRIR NESTE COMPUTADOR** (Chrome/Safari).

            ## Instalar no macOS

            Abra o `.pkg` e siga o instalador (ele pede a senha do Mac). O instalador ainda não é
            assinado pela Apple, então na primeira vez o macOS bloqueia: vá em **Ajustes do Sistema →
            Privacidade e Segurança** e clique em **Abrir Mesmo Assim**. Ou instale pelo Terminal:

            ```
            sudo installer -pkg ~/Downloads/MLiveMIX-${{ env.TAG }}-macOS.pkg -target /
            ```

            ## Instalar no Windows

            Copie `MLiveMIX.vst3` para `C:\Program Files\Common Files\VST3\` e peça para a DAW
            procurar plugins novos (FL Studio: *Options → Manage plugins → Find plugins*).

            ## Instalar no Linux

            Copie `MLiveMIX.vst3` para `~/.vst3/`.
